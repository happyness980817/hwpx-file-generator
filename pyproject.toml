[project]
name = "notion-workspace-writer-agent"
version = "0.1.0"
description = "K-brand application drafts and HWPX generation with Streamlit"
readme = "README.md"
authors = [
    { name = "Paul Jang", email = "happyness980817@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "openai>=3.22.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.4",
    "streamlit>=1.64.0",
    "supabase>=2.28,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
